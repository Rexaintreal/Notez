name: notez
description: "Notez is an android notes application built from scratch using Flutter it uses Isar for local database management and has features like a whiteboard CURD operations for Notes and even exporting all the notes with a clean and minimal UI."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  change_app_package_name: ^1.5.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  popover: ^0.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#fab344"        
  image: assets/logo.png  
  android: true
  ios: true
